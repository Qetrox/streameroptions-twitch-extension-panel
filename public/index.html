<!DOCTYPE HTML>

<head>
    <title>Streamer Options Twitch Panel</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Kanit:wght@500&family=Sometype+Mono&display=swap"
        rel="stylesheet">
    <style>
        a {
            text-decoration: inherit;
            color: inherit;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #eee;
            width: 318px;
            height: 500px;
            font-family: 'Kanit', sans-serif;
        }

        .header {
            background-color: #050505;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .header img {
            width: 90%;
        }

        .content {
            height: 380px;
        }

        .content>div {
            height: inherit;
        }

        .content>.home,
        .content>.top-points,
        .content>.top-watchtime {
            display: flex;
            justify-content: center;
            overflow-y: scroll;
            flex-wrap: wrap;
        }

        .content>.home>.module {
            width: 90%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .footer-nav {
            background-color: #050505;
            height: 40px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
        }

        .footer-nav-item {
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 100ms ease-in-out;
        }

        .footer-nav-item h1 {
            color: #fff;
            font-size: 12px;
            margin: 0;
            margin-left: 5px;
        }

        table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
        }

        .home {
            text-align: center;
        }

        table,
        th,
        td {
            border: 0px solid #050505;
        }

        th,
        td {
            padding: 5px;
            text-align: center;
        }
        .module {
            width: 90%;
            margin: 10px auto;
            background-color: #fff;
            border-radius: 5px;
            height: 100px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            transition: all 100ms ease-in-out;
        }
        .module:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
        }

        .module > img {
            width: 50px;
        }
        .module > h1 {
            text-align: center;
            font-size: 20px;
            margin: 0;
            margin-left: 5px;
        }
        table {
            margin: 10px auto;
            border-radius: 2px;
            background-color: #fff;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            transition: all 100ms ease-in-out;
        }
        table:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="so_logo_white.png" alt="Streamer Options">
    </div>
    <div class="content">
        <div class="home" style="display: flex;">
        </div>
        <div class="top-points" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <div class="top-watchtime" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Minutes</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
    <div class="footer-nav">
        <div class="footer-nav-item" id="home-btn" style="border-bottom: 2px solid rgba(255, 255, 255, 1)">
            <span class="material-symbols-outlined">
                home
            </span>
            <h1> Home</h1>
        </div>
        <div class="footer-nav-item" id="points-btn" style="border-bottom: 2px solid rgba(255, 255, 255, 0)">
            <span class="material-symbols-outlined">
                social_leaderboard
            </span>
            <h1> Points</h1>
        </div>
        <div class="footer-nav-item" id="watchtime-btn"
            style="border-bottom: 2px solid rgba(255, 255, 255, 0)">
            <span class="material-symbols-outlined">
                leaderboard
            </span>
            <h1> Watchtime</h1>
        </div>
    </div>


</body>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<script src="./client.js"></script>

</html>
